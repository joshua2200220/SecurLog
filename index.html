const CACHE = 'securlog-v2';
const ASSETS = [self.location.pathname];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys =>
    Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
  ));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  if (!e.request.url.startsWith('http')) return;
  if (e.request.url.includes('firebasedatabase') || e.request.url.includes('firebaseio')) return;
  e.respondWith(
    fetch(e.request).catch(() => caches.match(e.request))
  );
});`;

async function fbUpdate(path, data) { await update(ref(db, path), data); }

let authTab = 'admin';
window.switchAuthTab = function(tab) {
  authTab=tab;
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='admin')||(i===1&&tab==='agent')));
  document.getElementById('login-id').value='';
  document.getElementById('login-pw').value='';
  document.getElementById('auth-error').style.display='none';
};

window.doLoginForm = function(e) {
  e.preventDefault();
  doLogin();
};

window.doLogin = function() {
  const id = document.getElementById('login-id').value.trim();
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.display='none';
  if(authTab==='admin') {
    const adm = state.admins.find(a=>a.id===id&&a.password===pw);
    if(!adm){ errEl.textContent='Identifiants invalides.'; errEl.style.display='block'; return; }
    state.currentUser=adm; state.currentRole='admin';
  } else {
    const agent = state.agents.find(a=>a.id===id&&a.password===pw&&a.status==='actif');
    if(!agent){ errEl.textContent='Identifiants invalides ou compte inactif.'; errEl.style.display='block'; return; }
    state.currentUser=agent;
    state.currentRole=agent.isAdmin?'admin':'agent';
  }
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('sb-username').textContent=state.currentUser.name;
  document.getElementById('sb-role').textContent=state.currentRole==='admin'?'Administrateur':'Agent de sécurité';
  buildNav();
  navTo(state.currentRole==='admin'?'dashboard':'saisie');
};

window.doLogout = function() {
  state.currentUser=null; state.currentRole=null; state.currentPage=null;
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('login-id').value='';
  document.getElementById('login-pw').value='';
};

function getShiftEntry(agentId, day){
  const entry=(state.planning[agentId]||{})[day]||null;
  if(!entry) return {shift:'—',site:''};
  if(typeof entry==='string') return {shift:entry,site:''};
  return {shift:entry.shift||'—',site:entry.site||''};
}

function renderPlanning(){
  const isMobile=window.innerWidth<=768;
  return isMobile?renderPlanningMobile():renderPlanningDesktop();
}

function renderPlanningDesktop(){
  return `<div class="page-header"><div class="page-header-text"><h2>📅 Planning des agents</h2><p>Cliquez sur un créneau pour modifier</p></div></div>

      <div class="schedule-cell header">Agent</div>

window.editShift=function(agentId,day,current,currentSite){
  const agent=state.agents.find(a=>a.id===agentId);

        <option ${current==='J 14h-22h'?'selected':''}>J 14h-22h</option>
        <option ${current==='N 22h-06h'?'selected':''}>N 22h-06h</option>

    </div>
    <div class="form-group" id="custom-shift-row" style="display:none;margin-bottom:0.75rem;"><label>Horaire personnalisé</label><input type="text" id="custom-shift-val" placeholder="ex: J 08h-16h"/></div>

  document.getElementById('shift-val').addEventListener('change',function(){
    document.getElementById('custom-shift-row').style.display=this.value==='custom'?'flex':'none';
  });
};

window.saveShift=async function(agentId,day){
  let val=document.getElementById('shift-val').value;
  if(val==='custom') val=document.getElementById('custom-shift-val').value.trim()||'—';
  const site=document.getElementById('shift-site').value;
  if(!state.planning[agentId]) state.planning[agentId]={};
  state.planning[agentId][day]={shift:val,site};
  await fbSet(`planning/${agentId}/${day}`,{shift:val,site});
  closeModal(); notify('Planning mis à jour'); navTo('planning');
};

window.submitRonde=async function(){
  const date=document.getElementById('r-date').value;
  const start=document.getElementById('r-start').value;
  const end=document.getElementById('r-end').value;
  const zonesRaw=document.getElementById('r-zones').value.trim();
  const anomalies=document.getElementById('r-anomalies').value.trim()||'RAS';
  if(!date||!start||!end||!zonesRaw){notify('Remplissez tous les champs','danger');return;}
  const zones=zonesRaw.split(',').map(z=>z.trim()).filter(Boolean);
  const newRonde={agentId:state.currentUser.id,agentName:state.currentUser.name,date,start,end,zones,anomalies,status:anomalies.toUpperCase()==='RAS'?'complète':'anomalie'};
  const r=await fbPush('rondes',newRonde); newRonde._key=r.key;
  state.rondes.push(newRonde);
  notify('Ronde enregistrée'); navTo('mes_rondes');
};

// ─── MON PLANNING ───
function renderMonPlanning(){
  const myPlan=state.planning[state.currentUser.id]||{};
  const todayStr=new Date().toISOString().split('T')[0];
  return `<div class="page-header"><div class="page-header-text"><h2>📅 Mon planning</h2></div></div>
  <div class="form-section"><h3>Semaine du 28 avril au 4 mai 2025</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:0.5rem;">
      ${DAYS.map((day,i)=>{
        const entry=myPlan[day]||null;
        const shift=entry?entry.shift:'Non assigné';
        const site=entry?entry.site:'';
        const isToday=day===todayStr;
        const isRest=shift==='Repos';
        const isNight=shift.startsWith('N');
        return `<div style="background:${isToday?'#0f1d2e':'#0a0e1a'};border:1px solid ${isToday?'#4a9ede':'#1e3a5f'};border-radius:3px;padding:0.75rem;text-align:center;">
          <div style="font-size:0.62rem;color:#4a6080;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;">${DAY_LABELS[i]}</div>
          <div style="font-size:0.88rem;font-weight:600;color:${isRest?'#4a6080':isNight?'#9370db':'#4a9ede'};">${shift}</div>
          ${site?`<div style="font-size:0.65rem;color:#27c99a;margin-top:4px;">📍 ${site}</div>`:''}
          ${isToday?'<div style="font-size:0.6rem;color:#f0a020;margin-top:4px;">AUJOURD HUI</div>':''}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

// ─── HISTORIQUE ───
function renderHistorique(){
  const mine=[...state.mainCourante].filter(e=>e.agentId===state.currentUser.id).reverse();
  return `<div class="page-header"><div class="page-header-text"><h2>📋 Mon historique</h2></div></div>
  <div class="timeline">
    ${mine.length===0?'<p style="color:#4a6080;">Aucun événement enregistré.</p>':
    mine.map(e=>`<div class="tl-entry">
      <div class="tl-dot ${e.type==='incident'?'incident':e.type==='ronde'?'ronde':'info'}"></div>
      <div class="tl-time">${e.date} — ${e.time}</div>
      <div class="tl-content ${e.priority==='high'?'incident-priority-high':e.priority==='med'?'incident-priority-med':'incident-priority-low'}">
        <h4>${e.title}</h4><p>${e.description}</p>
        <div class="tl-meta">${typeBadge(e.type)} ${priorityBadge(e.priority)} ${statusBadge(e.status)}</div>
      </div>
    </div>`).join('')}
  </div>`;
}

// ─── MON COMPTE ───
window.openMyAccount=function(){
  openModal(`<h3>🔑 Mon compte</h3>
    <p style="color:#4a6080;font-size:0.78rem;margin-bottom:1rem;">Connecté en tant que : <strong style="color:#c8d8e8;">${state.currentUser.name}</strong></p>
    <div class="form-group" style="margin-bottom:0.75rem;"><label>Mot de passe actuel *</label>
      <div class="pw-field-wrap"><input type="password" id="mc-pw-old" placeholder="Mot de passe actuel..." autocomplete="current-password"/><button type="button" onclick="togglePw('mc-pw-old',this)">👁</button></div>
    </div>
    <div class="form-group" style="margin-bottom:0.75rem;"><label>Nouveau mot de passe *</label>
      <div class="pw-field-wrap"><input type="password" id="mc-pw-new" placeholder="Nouveau mot de passe..." autocomplete="new-password"/><button type="button" onclick="togglePw('mc-pw-new',this)">👁</button></div>
    </div>
    <div class="form-group"><label>Confirmer *</label>
      <div class="pw-field-wrap"><input type="password" id="mc-pw-confirm" placeholder="Confirmer..." autocomplete="new-password"/><button type="button" onclick="togglePw('mc-pw-confirm',this)">👁</button></div>
    </div>
    <div id="mc-pw-error" style="display:none;margin-top:0.5rem;" class="auth-error"></div>
    <div class="modal-actions">
      <button class="btn-sm" onclick="closeModal()">Annuler</button>
      <button class="btn-sm success" onclick="saveMyPassword()">Enregistrer</button>
    </div>`);
};

window.saveMyPassword=async function(){
  const old=document.getElementById('mc-pw-old').value;
  const nw=document.getElementById('mc-pw-new').value;
  const conf=document.getElementById('mc-pw-confirm').value;
  const errEl=document.getElementById('mc-pw-error');
  if(!old||!nw||!conf){errEl.textContent='Tous les champs sont requis.';errEl.style.display='block';return;}
  if(old!==state.currentUser.password){errEl.textContent='Mot de passe actuel incorrect.';errEl.style.display='block';return;}
  if(nw!==conf){errEl.textContent='Les nouveaux mots de passe ne correspondent pas.';errEl.style.display='block';return;}
  if(nw.length<6){errEl.textContent='Minimum 6 caractères.';errEl.style.display='block';return;}
  state.currentUser.password=nw;
  if(state.currentRole==='admin'){
    await fbUpdate('admins/'+state.currentUser._key,{password:nw});
  } else {
    const ag=state.agents.find(a=>a._key===state.currentUser._key);
    if(ag) ag.password=nw;
    await fbUpdate('agents/'+state.currentUser._key,{password:nw});
  }
  closeModal(); notify('Mot de passe mis à jour dans Firebase ✓');
};

// ─── MODAL ───
window.openModal=function(html){
  document.getElementById('modal-inner').innerHTML=html;
  document.getElementById('modal-bg').classList.add('open');
};
window.closeModal=function(){document.getElementById('modal-bg').classList.remove('open');};
document.addEventListener('click',e=>{if(e.target.id==='modal-bg') closeModal();});

// ─── BADGES ───
function typeBadge(t){
  const map={prise_poste:'<span class="badge badge-info">Prise de poste</span>',ronde:'<span class="badge badge-success">Ronde</span>',incident:'<span class="badge badge-danger">Incident</span>',transmission:'<span class="badge badge-gray">Transmission</span>',info:'<span class="badge badge-info">Information</span>'};
  return map[t]||`<span class="badge badge-gray">${t}</span>`;
}
function priorityBadge(p){
  const map={high:'<span class="badge badge-danger">Urgente</span>',med:'<span class="badge badge-warn">Importante</span>',low:'<span class="badge badge-gray">Normale</span>'};
  return map[p]||'';
}
function statusBadge(s){
  const map={validé:'<span class="badge badge-success">Validé</span>','en cours':'<span class="badge badge-warn">En cours</span>',annulé:'<span class="badge badge-danger">Annulé</span>'};
  return map[s]||`<span class="badge badge-gray">${s}</span>`;
}

// ─── MOBILE ───
window.toggleSidebar=function(){
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('mobile-overlay').classList.toggle('open');
};
window.closeSidebar=function(){
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('mobile-overlay').classList.remove('open');
};

function buildBottomNav(){
  const items=state.currentRole==='admin'
    ?[{id:'dashboard',icon:'◈',label:'Accueil'},{id:'main_courante',icon:'📋',label:'MC'},{id:'planning',icon:'📅',label:'Planning'},{id:'agents',icon:'👥',label:'Agents'},{id:'sites',icon:'🏢',label:'Sites'}]
    :[{id:'saisie',icon:'✏',label:'Saisir'},{id:'mes_rondes',icon:'🔄',label:'Rondes'},{id:'mon_planning',icon:'📅',label:'Planning'},{id:'historique',icon:'📋',label:'Histo'},{id:'sites',icon:'🏢',label:'Sites'}];
  document.getElementById('bottom-nav-inner').innerHTML=items.map(i=>
    `<button class="bnav-item ${state.currentPage===i.id?'active':''}" onclick="navTo('${i.id}');closeSidebar()">
      <span class="bnav-icon">${i.icon}</span>${i.label}
    </button>`).join('');
}

// ─── INIT ───
(async()=>{
  try{
    await loadAllData();
    document.getElementById('loading-overlay').style.display='none';
    document.getElementById('auth-screen').style.display='flex';
  }catch(err){
    document.querySelector('#loading-overlay p').textContent='Erreur de connexion Firebase';
    document.querySelector('#loading-overlay p').style.color='#e24b4a';
    console.error(err);
  }
})();

</script>
